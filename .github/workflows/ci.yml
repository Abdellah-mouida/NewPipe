name: Android CI

on:
  push:
    branches:
      - dev
      - master
      - 'redesign/**'

  pull_request:
    branches:
      - dev
      - master
      - refactor
      - 'release**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: |
          android sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

      - name: Build, lint and run unit tests
        run: |
          ./gradlew --no-daemon \
            assembleContinuous \
            lintContinuous \
            testDebugUnitTest \
            --stacktrace \
            -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-apk-${{ github.run_number }}
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  android-tests:
    name: Android emulator tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 23
            target: default
            arch: x86

          - api-level: 35
            target: default
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK 37.0
        run: |
          android sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedCheck --stacktrace

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14


  publish-stable:
    name: Publish signed stable release
    needs: [build, android-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/redesign/premium-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: |
          android sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0

      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" == "0" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Stable release not published"
              echo
              echo "Configure all four Android signing secrets to publish a production-signed APK and AAB."
              echo "The CI build, lint, unit tests, and emulator tests have completed independently."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$present" == "4" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only some Android signing secrets are configured. Configure all four or none." >&2
            exit 1
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/newpipe-release.jks"
          chmod 600 "$RUNNER_TEMP/newpipe-release.jks"
          test -s "$RUNNER_TEMP/newpipe-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/newpipe-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/newpipe-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Verify and name release packages
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          bundle_dir="app/build/outputs/bundle/release"
          version_name="$(jq -r '.elements[0].versionName' "$apk_dir/output-metadata.json")"
          apk="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          mv "$apk" "NewPipe-v${version_name}.apk"
          mv "$aab" "NewPipe-v${version_name}.aab"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Publish stable GitHub release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving the published release unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" \
            "NewPipe-v${VERSION_NAME}.apk" \
            "NewPipe-v${VERSION_NAME}.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NewPipe ${VERSION_NAME}" \
            --latest \
            --notes "Stable release of the NewPipe redesign fork.

          - Source branch: redesign/premium-ui
          - Tested commit: $GITHUB_SHA
          - CI build, lint, unit tests, and Android emulator tests passed.
          - APK is signed with this fork's upload/release key.

          This is an unofficial fork of TeamNewPipe/NewPipe. Back up your data before switching from a differently signed NewPipe installation."
