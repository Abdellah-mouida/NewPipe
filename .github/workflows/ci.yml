name: Android CI

on:
  push:
    branches:
      - dev
      - master
      - 'redesign/**'

  pull_request:
    branches:
      - dev
      - master
      - refactor
      - 'release**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: |
          android sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

      - name: Build, lint and run unit tests
        run: |
          ./gradlew --no-daemon \
            assembleContinuous \
            lintContinuous \
            testDebugUnitTest \
            --stacktrace \
            -DskipFormatKtlint

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-apk-${{ github.run_number }}
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  android-tests:
    name: Android emulator tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 23
            target: default
            arch: x86

          - api-level: 35
            target: default
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK 37.0
        run: |
          android sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedCheck --stacktrace

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
