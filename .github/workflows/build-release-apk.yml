name: NewPipe Release Build

# Manual signed release build. GitHub Actions secrets are required; this workflow
# never publishes or labels an unsigned APK as a release.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Build signed release APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out selected branch or tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: |
          android sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0

      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" != "4" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No release was built: configure all four Android signing secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/newpipe-release.jks"
          chmod 600 "$RUNNER_TEMP/newpipe-release.jks"
          test -s "$RUNNER_TEMP/newpipe-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/newpipe-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and Android App Bundle
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/newpipe-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Verify and rename release packages
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          bundle_dir="app/build/outputs/bundle/release"
          version_name="$(jq -r '.elements[0].versionName' "$apk_dir/output-metadata.json")"
          apk="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          mv "$apk" "NewPipe-v${version_name}.apk"
          mv "$aab" "NewPipe-v${version_name}.aab"

      - name: Upload signed release packages and R8 mapping
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-release-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            NewPipe-v*.apk
            NewPipe-v*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo "## NewPipe release build"
            echo
            echo "- Source ref: `$GITHUB_REF`"
            echo "- Commit: `$GITHUB_SHA`"
            if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
              echo "- Signing: verified release keystore"
            else
              echo "- Signing: not configured; build was skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
