name: NewPipe Release Build

# Run this workflow manually from the branch or tag selected in the
# GitHub Actions "Run workflow" dropdown. This produces unsigned release
# packages; production signing is intentionally not configured until a
# release keystore is supplied through GitHub Actions secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Build release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out selected branch or tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: |
          android sdk install \
            platforms/android-37.0 \
            build-tools/37.0.0

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

      - name: Build release APK and Android App Bundle
        run: |
          ./gradlew --no-daemon \
            assembleRelease \
            bundleRelease \
            --stacktrace

      - name: Rename release APK
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"
          METADATA="$APK_DIR/output-metadata.json"
          VERSION_NAME="$(jq -r '.elements[0].versionName' "$METADATA")"
          echo "Built NewPipe version: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mv "$APK" "$APK_DIR/NewPipe_v${VERSION_NAME}.apk"

      - name: Upload release packages and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-release-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo "## NewPipe release build"
            echo
            echo "- Source ref: `$GITHUB_REF`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Signing: unsigned (no production keystore configured)"
            echo "- Download: Actions → this workflow run → Artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
